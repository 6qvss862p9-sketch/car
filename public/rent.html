<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аренда — DriveRent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html#home" class="logo">Drive<span>Rent</span></a>

    <nav class="nav" id="mainNav">
        <a href="index.html#home">Басты бет</a>
        <a href="index.html#cars">Автопарк</a>
        <a href="index.html#conditions">Шарттар</a>
        <a href="index.html#services">Қызметтер</a>
        <a href="index.html#about">Біз туралы</a>
        <a href="index.html#contact">Байланыс</a>
    </nav>

    <div class="header-actions">
        <a class="phone" href="tel:+77001234567">+7 700 123 45 67</a>
        <button class="menu-button" onclick="toggleMenu()" aria-label="Меню">☰</button>
    </div>
</header>

<main class="rent-page">
    <a class="back-link" href="index.html#cars">← Автопаркке оралу</a>

    <div class="rent-layout" id="rentLayout">
        <div class="rent-car" id="rentCar"></div>

        <div class="rent-form" id="rentForm">
            <p class="section-label">АРЕНДА</p>
            <h2>Көлікті жалға алу</h2>

            <label for="name">Аты-жөніңіз</label>
            <input type="text" id="name" placeholder="Аты-жөніңіз">

            <label for="phone">Телефон</label>
            <input type="tel" id="phone" placeholder="+7 700 000 00 00">

            <div class="date-grid">
                <div>
                    <label for="startDate">Басталу күні</label>
                    <input type="date" id="startDate">
                </div>
                <div>
                    <label for="endDate">Аяқталу күні</label>
                    <input type="date" id="endDate">
                </div>
            </div>

            <div class="price-box">
                <span>Жалпы баға</span>
                <strong id="totalPrice">0 ₸</strong>
            </div>

            <button class="rent-button" id="submitBtn">Арендаға тапсырыс беру →</button>
        </div>
    </div>

    <div class="rent-success" id="rentSuccess" hidden></div>
    <div class="rent-error" id="rentError" hidden>
        <h2>Көлік табылмады</h2>
        <p>Автопарктен көлікті қайта таңдаңыз.</p>
        <a class="dark-button" href="index.html#cars">Автопаркке өту →</a>
    </div>
</main>

<footer>
    <a href="index.html#home" class="logo">Drive<span>Rent</span></a>
    <p>© 2026 DriveRent. Алматы, Қазақстан.</p>
    <a href="tel:+77001234567">+7 700 123 45 67</a>
</footer>

<script src="cars.js"></script>
<script src="rent.js"></script>
</body>
</html>
